<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研学项目查询 - 乡韵智学</title>
  <style>
    /* 使用与基地申报页面相同的样式变量和基础样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    :root {
      --primary-color: #4a7c59;
      --primary-dark: #3a6b49;
      --primary-light: #c8e6c9;
      --accent-color: #e6b450;
      --text-dark: #2c3e2d;
      --text-light: #6b8e6b;
      --bg-light: #f9fffa;
      --white: #ffffff;
      --gray-light: #f5f5f5;
    }

    body {
      background: linear-gradient(135deg, #e6f2e6, #c8e6c9);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      z-index: 100;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary-color);
      display: flex;
      align-items: center;
    }

    .logo-icon {
      margin-right: 10px;
      font-size: 28px;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links li {
      margin-left: 30px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      transition: color 0.3s;
      position: relative;
      padding: 5px 0;
    }

    .nav-links a:hover {
      color: var(--primary-color);
    }

    .nav-links a.active {
      color: var(--primary-color);
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    .user-actions {
      display: flex;
      align-items: center;
    }

    .user-actions a {
      text-decoration: none;
      color: var(--text-dark);
      margin-left: 20px;
      transition: color 0.3s;
    }

    .user-actions a:hover {
      color: var(--primary-color);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-left: 20px;
      cursor: pointer;
      position: relative;
    }

    .user-menu {
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 180px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s;
    }

    .user-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .user-menu a {
      display: block;
      padding: 12px 15px;
      color: var(--text-dark);
      text-decoration: none;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .user-menu a:hover {
      background: #f9f9f9;
      color: var(--primary-color);
    }

    .user-menu a:last-child {
      border-bottom: none;
    }

    /* 主内容区 */
    .main-content {
      margin-top: 80px;
      padding: 40px 5%;
    }

    /* 页面标题 */
    .page-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .page-title {
      font-size: 36px;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .page-subtitle {
      font-size: 18px;
      color: var(--text-light);
      max-width: 600px;
      margin: 0 auto;
    }

    /* 页脚 */
    .footer {
      background: var(--primary-color);
      color: var(--white);
      padding: 40px 5%;
      text-align: center;
    }

    .footer-content {
      max-width: 1000px;
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .footer-links a {
      color: var(--white);
      text-decoration: none;
      margin: 0 15px;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: var(--accent-color);
    }

    .copyright {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* 搜索筛选区域 */
    .search-section {
      background: var(--white);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 40px;
    }

    .search-title {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary-light);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .filter-select, .filter-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--primary-light);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .filter-select:focus, .filter-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
    }

    .search-button {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .search-button:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(74, 124, 89, 0.3);
    }

    /* 项目展示区域 */
    .projects-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 30px;
      text-align: center;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .project-card {
      background: var(--white);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s;
    }

    .project-card:hover {
      transform: translateY(-5px);
    }

    .project-image {
      height: 200px;
      background-color: var(--primary-light);
      background-size: cover;
      background-position: center;
    }

    .project-content {
      padding: 20px;
    }

    .project-title {
      font-size: 20px;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .project-location, .project-theme, .project-duration {
      color: var(--text-light);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .project-location::before, .project-theme::before, .project-duration::before {
      content: "📍";
      margin-right: 8px;
    }

    .project-theme::before {
      content: "🏷️";
    }

    .project-duration::before {
      content: "⏱️";
    }

    .project-price {
      font-size: 18px;
      color: var(--accent-color);
      font-weight: bold;
      margin: 15px 0;
    }

    .project-select-button {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .project-select-button:hover {
      background: var(--primary-dark);
    }

    /* 行程生成区域 */
    .itinerary-section {
      background: var(--white);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 40px;
    }

    .itinerary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .itinerary-title {
      font-size: 24px;
      color: var(--primary-color);
    }

    .itinerary-actions {
      display: flex;
      gap: 10px;
    }

    .action-button {
      padding: 8px 15px;
      border: 1px solid var(--primary-color);
      border-radius: 5px;
      background: white;
      color: var(--primary-color);
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-button:hover {
      background: var(--primary-color);
      color: white;
    }

    .itinerary-days {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .day-card {
      border: 1px solid var(--primary-light);
      border-radius: 10px;
      overflow: hidden;
    }

    .day-header {
      background: var(--primary-light);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      font-size: 18px;
      color: var(--primary-color);
      font-weight: bold;
    }

    .day-content {
      padding: 20px;
    }

    .activity-item {
      display: flex;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--gray-light);
    }

    .activity-time {
      font-weight: bold;
      color: var(--primary-color);
      min-width: 100px;
    }

    .activity-details {
      flex: 1;
    }

    .activity-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .activity-description {
      color: var(--text-light);
      font-size: 14px;
    }

    /* 费用汇总 */
    .cost-summary {
      background: var(--bg-light);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    .cost-title {
      font-size: 18px;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .cost-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cost-total {
      border-top: 1px solid var(--primary-light);
      padding-top: 10px;
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
    }

    /* 页面切换 */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        padding: 15px;
      }

      .nav-links {
        margin: 20px 0;
      }

      .nav-links li {
        margin: 0 10px;
      }

      .page-title {
        font-size: 28px;
      }

      .filter-row {
        flex-direction: column;
      }

      .filter-group {
        min-width: 100%;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .itinerary-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }
  </style>
</head>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="logo">
    <span class="logo-icon"><img style="width: 50px;height: 50px" src="./images/27.png" alt=""></span>

  </div>
  <ul class="nav-links">

<!-- 主内容区 -->
<main class="main-content">
  <!-- 项目搜索页面 -->
  <div id="search-page" class="page active">
    <!-- 页面标题 -->
    <header class="page-header">
      <h1 class="page-title">研学项目查询</h1>
      <p class="page-subtitle">根据您的需求筛选和选择研学项目，我们将为您生成个性化行程计划</p>
    </header>

    <!-- 搜索筛选区域 -->
    <section class="search-section">
      <h2 class="search-title">筛选条件</h2>
      <form id="search-form">
        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label" for="destination">目的地</label>
            <select id="destination" class="filter-select">
              <option value="">请选择目的地</option>
              <option value="zhejiang">浙江省</option>
              <option value="jiangsu">江苏省</option>
              <option value="anhui">安徽省</option>
              <option value="jiangxi">江西省</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="theme">研学主题</label>
            <select id="theme" class="filter-select">
              <option value="">请选择研学主题</option>
              <option value="agriculture">现代农业</option>
              <option value="culture">非遗文化</option>
              <option value="red">红色教育</option>
              <option value="nature">自然探索</option>
              <option value="science">科技体验</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="duration">出行天数</label>
            <select id="duration" class="filter-select">
              <option value="">请选择出行天数</option>
              <option value="1">1天</option>
              <option value="2">2天</option>
              <option value="3">3天</option>
              <option value="4">4天及以上</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label" for="adults">成人数量</label>
            <input type="number" id="adults" class="filter-input" min="1" value="2">
          </div>

          <div class="filter-group">
            <label class="filter-label" for="children">儿童数量</label>
            <input type="number" id="children" class="filter-input" min="0" value="1">
          </div>

          <div class="filter-group">
            <label class="filter-label" for="travel-date">出行日期</label>
            <input type="date" id="travel-date" class="filter-input">
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label">服务需求</label>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px;">
              <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" name="services" value="lunch"> 午餐
              </label>
              <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" name="services" value="insurance"> 保险
              </label>
              <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" name="services" value="transportation"> 包车
              </label>
              <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" name="services" value="guide"> 导游
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="search-button">搜索研学项目</button>
      </form>
    </section>

    <!-- 项目展示区域 -->
    <section class="projects-section">
      <h2 class="section-title">推荐研学项目</h2>
      <div class="projects-grid" id="projects-grid">
        <!-- 项目卡片将通过JavaScript动态生成 -->
      </div>
    </section>
  </div>

  <!-- 行程生成页面 -->
  <div id="itinerary-page" class="page">
    <header class="page-header">
      <h1 class="page-title">您的个性化研学行程</h1>
      <p class="page-subtitle">以下是根据您的需求生成的研学行程计划</p>
    </header>

    <section class="itinerary-section">
      <div class="itinerary-header">
        <h2 class="itinerary-title" id="itinerary-project-title">杭州现代农业研学之旅</h2>
        <div class="itinerary-actions">
          <button class="action-button" id="edit-itinerary">修改行程</button>
          <button class="action-button" id="print-itinerary">打印行程</button>
          <button class="action-button" id="save-itinerary">保存行程</button>
        </div>
      </div>

      <div class="filter-row" style="margin-bottom: 20px;">
        <div class="filter-group">
          <label class="filter-label">出行日期</label>
          <div id="itinerary-date" style="padding: 12px 0;">2023年10月15日</div>
        </div>

        <div class="filter-group">
          <label class="filter-label">出行人数</label>
          <div id="itinerary-people" style="padding: 12px 0;">2位成人，1位儿童</div>
        </div>

        <div class="filter-group">
          <label class="filter-label">行程天数</label>
          <div id="itinerary-duration" style="padding: 12px 0;">2天1晚</div>
        </div>
      </div>

      <div class="itinerary-days" id="itinerary-days">
        <!-- 行程天数将通过JavaScript动态生成 -->
      </div>

      <div class="cost-summary">
        <h3 class="cost-title">费用汇总</h3>
        <div class="cost-item">
          <span>项目费用</span>
          <span id="cost-project">¥980</span>
        </div>
        <div class="cost-item">
          <span>午餐费用</span>
          <span id="cost-lunch">¥150</span>
        </div>
        <div class="cost-item">
          <span>保险费用</span>
          <span id="cost-insurance">¥30</span>
        </div>
        <div class="cost-item">
          <span>交通费用</span>
          <span id="cost-transportation">¥200</span>
        </div>
        <div class="cost-item cost-total">
          <span>总计</span>
          <span id="cost-total">¥1360</span>
        </div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <button class="search-button" id="confirm-itinerary">确认行程并预订</button>
      </div>
    </section>
  </div>
</main>

  document.addEventListener('DOMContentLoaded', function() {
    // 获取页面元素
    const searchPage = document.getElementById('search-page');
    const itineraryPage = document.getElementById('itinerary-page');
    const searchForm = document.getElementById('search-form');
    const projectsGrid = document.getElementById('projects-grid');
    const itineraryDays = document.getElementById('itinerary-days');

    // 用户菜单功能
    const userAvatar = document.getElementById('userAvatar');
    const userMenu = document.getElementById('userMenu');
    userAvatar.addEventListener('click', function() {
      userMenu.classList.toggle('active');
    });

    // 点击其他地方关闭用户菜单
    document.addEventListener('click', function(e) {
      if (!userAvatar.contains(e.target) && !userMenu.contains(e.target)) {
        userMenu.classList.remove('active');
      }
    });

    // 初始化项目展示
    renderProjects(projects);

    // 搜索表单提交事件
    searchForm.addEventListener('submit', function(e) {
      e.preventDefault();

      // 获取筛选条件
      const destination = document.getElementById('destination').value;
      const theme = document.getElementById('theme').value;
      const duration = document.getElementById('duration').value;

      // 过滤项目
      let filteredProjects = projects;

      if (destination) {
        filteredProjects = filteredProjects.filter(project =>
                project.location.includes(getProvinceName(destination))
        );
      }

      if (theme) {
        filteredProjects = filteredProjects.filter(project =>
                project.theme.includes(getThemeName(theme))
        );
      }

      if (duration) {
        filteredProjects = filteredProjects.filter(project =>
                project.duration.includes(getDurationText(duration))
        );
      }

      // 渲染过滤后的项目
      renderProjects(filteredProjects);
    });

    // 编辑行程按钮点击事件
    document.getElementById('edit-itinerary').addEventListener('click', function() {
      itineraryPage.classList.remove('active');
      searchPage.classList.add('active');
      window.scrollTo(0, 0);
    });

    // 打印行程按钮点击事件
    document.getElementById('print-itinerary').addEventListener('click', function() {
      window.print();
    });

    // 保存行程按钮点击事件
    document.getElementById('save-itinerary').addEventListener('click', function() {
      alert('行程已保存到个人中心！');
    });

    // 确认行程按钮点击事件
    document.getElementById('confirm-itinerary').addEventListener('click', function() {
      // 收集所有需要传递的数据
      const orderData = {
        project: document.getElementById('itinerary-project-title').textContent,
        location: '浙江进化', // 根据实际项目数据设置
        theme: '现代农业', // 根据实际项目数据设置
        duration: document.getElementById('itinerary-duration').textContent,
        date: document.getElementById('itinerary-date').textContent,
        adults: document.getElementById('adults').value || '2',
        children: document.getElementById('children').value || '1',
        contact: '张小姐', // 从表单获取
        phone: '18072118962', // 从表单获取
        email: 'zhang@qq.com', // 从表单获取
        total: document.getElementById('cost-total').textContent.replace('¥', '')
      };

      // 生成订单ID
      const orderId = 'XY' + new Date().getFullYear() +
              String(new Date().getMonth() + 1).padStart(2, '0') +
              String(new Date().getDate()).padStart(2, '0') +
              String(Math.floor(Math.random() * 1000)).padStart(3, '0');

      // 构建URL参数
      const params = new URLSearchParams();
      params.append('orderId', orderId);
      Object.keys(orderData).forEach(key => {
        params.append(key, orderData[key]);
      });

      // 跳转到成功页面
      window.location.href = 'project_success.html?' + params.toString();
      // 在实际应用中，这里应该跳转到预订页面
    });

    // 渲染项目列表
    function renderProjects(projectsList) {
      projectsGrid.innerHTML = '';

      if (projectsList.length === 0) {
        projectsGrid.innerHTML = '<p style="text-align: center; width: 100%; padding: 40px; color: var(--text-light);">没有找到符合条件的研学项目</p>';
        return;
      }

      projectsList.forEach(project => {
        const projectCard = document.createElement('div');
        projectCard.className = 'project-card';
        projectCard.innerHTML = `
                    <div class="project-image" style="background-image: url('${project.image}')"></div>
                    <div class="project-content">
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-location">${project.location}</p>
                        <p class="project-theme">${project.theme}</p>
                        <p class="project-duration">${project.duration}</p>
                        <p class="project-price">¥${project.price}/人</p>
                        <p style="color: var(--text-light); margin-bottom: 15px; font-size: 14px;">${project.description}</p>
                        <button class="project-select-button" data-id="${project.id}">选择此项目</button>
                    </div>
                `;

        projectsGrid.appendChild(projectCard);
      });

      // 为选择按钮添加事件监听器
      document.querySelectorAll('.project-select-button').forEach(button => {
        button.addEventListener('click', function() {
          const projectId = this.getAttribute('data-id');
          const selectedProject = projects.find(p => p.id == projectId);
          generateItinerary(selectedProject);
        });
      });
    }

    // 生成行程
    function generateItinerary(project) {
      // 获取用户选择的选项
      const adults = document.getElementById('adults').value || 2;
      const children = document.getElementById('children').value || 1;
      const travelDate = document.getElementById('travel-date').value || '2023-10-15';
      const lunchSelected = document.querySelector('input[name="services"][value="lunch"]').checked;
      const insuranceSelected = document.querySelector('input[name="services"][value="insurance"]').checked;
      const transportationSelected = document.querySelector('input[name="services"][value="transportation"]').checked;

      // 更新行程页面信息
      document.getElementById('itinerary-project-title').textContent = project.title;
      document.getElementById('itinerary-date').textContent = formatDate(travelDate);
      document.getElementById('itinerary-people').textContent = `${adults}位成人，${children}位儿童`;
      document.getElementById('itinerary-duration').textContent = project.duration;

      // 生成行程天数
      itineraryDays.innerHTML = '';
      const dayCount = parseInt(project.duration) || 2;

      for (let i = 1; i <= dayCount; i++) {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        let dayContent = '';
        if (i === 1) {
          dayContent = `
                        <div class="activity-item">
                            <div class="activity-time">08:00-09:30</div>
                            <div class="activity-details">
                                <div class="activity-title">集合出发</div>
                                <div class="activity-description">前往${project.location}，途中介绍行程安排和注意事项</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">09:30-12:00</div>
                            <div class="activity-details">
                                <div class="activity-title">${project.theme}体验活动一</div>
                                <div class="activity-description">参与${project.theme}相关实践活动，学习相关知识</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">12:00-13:30</div>
                            <div class="activity-details">
                                <div class="activity-title">午餐休息</div>
                                <div class="activity-description">${lunchSelected ? '享用当地特色午餐' : '自由用餐时间'}</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">13:30-16:30</div>
                            <div class="activity-details">
                                <div class="activity-title">${project.theme}体验活动二</div>
                                <div class="activity-description">深入体验${project.theme}活动，动手实践</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">16:30-17:30</div>
                            <div class="activity-details">
                                <div class="activity-title">总结分享</div>
                                <div class="activity-description">分享当天学习心得，总结收获</div>
                            </div>
                        </div>
                        ${dayCount > 1 ? `
                        <div class="activity-item">
                            <div class="activity-time">18:00-20:00</div>
                            <div class="activity-details">
                                <div class="activity-title">晚餐与自由活动</div>
                                <div class="activity-description">享用晚餐，自由活动时间</div>
                            </div>
                        </div>
                        ` : `
                        <div class="activity-item">
                            <div class="activity-time">17:30-19:00</div>
                            <div class="activity-details">
                                <div class="activity-title">返程</div>
                                <div class="activity-description">${transportationSelected ? '乘坐包车返回' : '自行安排返程'}</div>
                            </div>
                        </div>
                        `}
                    `;
        } else if (i === 2) {
          dayContent = `
                        <div class="activity-item">
                            <div class="activity-time">08:00-09:00</div>
                            <div class="activity-details">
                                <div class="activity-title">早餐</div>
                                <div class="activity-description">享用早餐，准备开始新一天的研学活动</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">09:00-12:00</div>
                            <div class="activity-details">
                                <div class="activity-title">${project.theme}深度体验</div>
                                <div class="activity-description">深入参与${project.theme}相关活动，巩固学习成果</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">12:00-13:30</div>
                            <div class="activity-details">
                                <div class="activity-title">午餐</div>
                                <div class="activity-description">${lunchSelected ? '享用当地特色午餐' : '自由用餐时间'}</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">13:30-15:30</div>
                            <div class="activity-details">
                                <div class="activity-title">成果展示与分享</div>
                                <div class="activity-description">展示研学成果，分享学习心得</div>
                            </div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-time">15:30-17:00</div>
                            <div class="activity-details">
                                <div class="activity-title">返程</div>
                                <div class="activity-description">${transportationSelected ? '乘坐包车返回' : '自行安排返程'}</div>
                            </div>
                        </div>
                    `;
        } else {
          dayContent = `
                        <div class="activity-item">
                            <div class="activity-time">全天</div>
                            <div class="activity-details">
                                <div class="activity-title">${project.theme}深度探索</div>
                                <div class="activity-description">全天深入体验${project.theme}活动，包含实践操作和理论学习</div>
                            </div>
                        </div>
                    `;
        }

        dayCard.innerHTML = `
                    <div class="day-header">
                        <div class="day-title">第${i}天</div>
                    </div>
                    <div class="day-content">
                        ${dayContent}
                    </div>
                `;

        itineraryDays.appendChild(dayCard);
      }

      // 计算费用
      const projectCost = project.price * (parseInt(adults) + parseInt(children));
      const lunchCost = lunchSelected ? (40 * (parseInt(adults) + parseInt(children)) * dayCount) : 0;
      const insuranceCost = insuranceSelected ? (10 * (parseInt(adults) + parseInt(children))) : 0;
      const transportationCost = transportationSelected ? (200 * (parseInt(adults) + parseInt(children))) : 0;
      const totalCost = projectCost + lunchCost + insuranceCost + transportationCost;

      // 更新费用显示
      document.getElementById('cost-project').textContent = `¥${projectCost}`;
      document.getElementById('cost-lunch').textContent = `¥${lunchCost}`;
      document.getElementById('cost-insurance').textContent = `¥${insuranceCost}`;
      document.getElementById('cost-transportation').textContent = `¥${transportationCost}`;
      document.getElementById('cost-total').textContent = `¥${totalCost}`;

      // 切换到行程页面
      searchPage.classList.remove('active');
      itineraryPage.classList.add('active');
      window.scrollTo(0, 0);
    }

    // 辅助函数：根据省份代码获取省份名称
    function getProvinceName(code) {
      const provinces = {
        'zhejiang': '浙江',
        'jiangsu': '江苏',
        'anhui': '安徽',
        'jiangxi': '江西'
      };
      return provinces[code] || '';
    }

    // 辅助函数：根据主题代码获取主题名称
    function getThemeName(code) {
      const themes = {
        'agriculture': '现代农业',
        'culture': '非遗文化',
        'red': '红色教育',
        'nature': '自然探索',
        'science': '科技体验'
      };
      return themes[code] || '';
    }

    // 辅助函数：根据天数代码获取天数文本
    function getDurationText(code) {
      const durations = {
        '1': '1天',
        '2': '2天',
        '3': '3天',
        '4': '4天'
      };
      return durations[code] || '';
    }

    // 辅助函数：格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      return `${year}年${month}月${day}日`;
    }
  });
</script>
</body>
</html>
