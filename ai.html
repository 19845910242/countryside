<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乡融智学 - 科技版</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
        }

        :root {
            --primary-color: #0a8c8c;
            --primary-dark: #066;
            --primary-light: #0db9b9;
            --accent-color: #00f5ff;
            --accent-glow: rgba(0, 245, 255, 0.5);
            --text-dark: #e0e0e0;
            --text-light: #a0a0a0;
            --bg-dark: #0a0f1a;
            --bg-darker: #050913;
            --bg-card: rgba(15, 25, 40, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error-color: #ff3e6d;
            --success-color: #00e6a9;
            --warning-color: #ffaa00;
        }

        body {
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            background-image:
                linear-gradient(rgba(10, 20, 40, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 20, 40, 0.8) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 5px 2px var(--accent-glow);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 700px;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 50px rgba(0, 245, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .chat-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color), var(--primary-color));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            z-index: -1;
        }

        .chat-header {
            background: rgba(10, 20, 40, 0.8);
            color: var(--text-dark);
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: messageAppear 0.3s ease-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border-bottom-right-radius: 5px;
            flex-direction: row-reverse;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--glass-bg);
            color: var(--text-dark);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 5px;
        }

        .error-message {
            align-self: flex-start;
            background: var(--error-color);
            color: white;
            border-bottom-left-radius: 5px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .user-avatar {
            background: linear-gradient(135deg, #4a7c59, #3a6b49);
        }

        .bot-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        }

        .message-content {
            flex: 1;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        .chat-input-container {
            display: flex;
            padding: 20px;
            background: rgba(10, 20, 40, 0.5);
            border-top: 1px solid var(--glass-border);
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(10, 140, 140, 0.3);
        }

        .input-field::placeholder {
            color: var(--text-light);
        }

        .send-button {
            padding: 15px 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .send-button:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button i {
            font-size: 18px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--glass-bg);
            color: var(--text-light);
            padding: 12px 18px;
            border-radius: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: typingPulse 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingPulse {

            0%,
            60%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            30% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .api-status {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .api-status.connected {
            background: rgba(0, 230, 169, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(0, 230, 169, 0.3);
        }

        .api-status.disconnected {
            background: rgba(255, 62, 109, 0.2);
            color: var(--error-color);
            border: 1px solid rgba(255, 62, 109, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .connected .status-dot {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .disconnected .status-dot {
            background: var(--error-color);
            box-shadow: 0 0 8px var(--error-color);
        }

        .typewriter {
            overflow: hidden;
            border-right: 2px solid var(--accent-color);
            white-space: pre-wrap;
            margin: 0;
            animation: blink-caret 1s step-end infinite;
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: var(--accent-color);
            }
        }

        .animation-container {
            position: fixed;
            bottom: 20px;
            right: 0px;
            z-index: 1000;
            width: 350px;
            height: 150px;
        }

        .status-animation {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2s infinite;
            position: absolute;
            top: 0;
            left: 0;
        }

        #thinking-animation {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        }

        #idle-animation {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
        }

        .animation-icon {
            font-size: 30px;
            color: white;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(10, 20, 40, 0.5);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 0 20px 15px;
        }

        .action-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-dark);
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .message {
                max-width: 85%;
            }

            .chat-input-container {
                padding: 15px;
            }

            .api-status {
                top: 10px;
                right: 10px;
            }

            .animation-container {
                width: 60px;
                height: 60px;
                bottom: 15px;
                right: 15px;
            }

            .animation-icon {
                font-size: 24px;
            }

            .message-avatar {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="api-status connected" id="apiStatus">
        <div class="status-dot"></div>
        <span>知识库已加载</span>
    </div>

    <div class="chat-container" style="position: relative;left: -200px;">
        <div class="chat-header">
            <div>乡融智学 - 本地知识库问答系统</div>
            <div style="font-size: 0.7rem; margin-top: 5px; opacity: 0.8;">基于本地JSON的智能问答</div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span>会话ID:</span>
                <span id="sessionId">RST-20251201-001</span>
            </div>
            <div class="info-item">
                <span>响应时间:</span>
                <span id="responseTime">0.0s</span>
            </div>
            <div class="info-item">
                <span>知识库版本:</span>
                <span id="knowledgeVersion">v2.5.1</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="clearBtn">清空对话</button>
            <button class="action-btn" id="exportBtn">导出记录</button>
            <button class="action-btn" id="helpBtn">使用帮助</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar bot-avatar">
                    <img src='images/bot-avatar.png' style='width: 40px; height: 40px; border-radius: 50%;' />
                </div>
                <div class="message-content">
                    <div>您好！我是小智，现在基于本地知识库为您提供准确的乡村文化知识问答。我可以回答关于传统手工艺、农耕技术、民间艺术等方面的问题。</div>
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" class="input-field" id="userInput" placeholder="请输入关于乡村文化、传统手工艺、农耕技术等方面的问题..."
                autocomplete="off">
            <button class="send-button" id="sendButton">
                <i>➤</i> 发送
            </button>
        </div>
    </div>

    <!-- 右下角动图容器 -->
    <div class="animation-container">
        <!-- 回答问题时的动图1 -->
        <div class="status-animation" id="thinking-animation">
            <div class="animation-icon">
                <img src="images/gif/a.gif" alt="思考中">
            </div>
        </div>

        <!-- 空闲/回答完毕时的动图2 -->
        <div class="status-animation" id="idle-animation">
            <div class="animation-icon">
                <img src="images/gif/b.gif" alt="待机中">
            </div>
        </div>
    </div>


    <script type="application/json" id="myData">
{
  "questions": [
    {
        "question": "什么是传统手工艺？",
        "answer": "传统手工艺是指以手工劳动为主的工艺制作方式，它承载着丰富的历史文化信息和民族特色。传统手工艺包括陶瓷、编织、刺绣、雕刻等多种形式，是乡村文化的重要组成部分。"
    },
    {
        "question": "竹编工艺有哪些特点？",
        "answer": "竹编工艺是利用竹子进行编织制作各种生活用品和艺术品的传统技艺。其特点包括：1、材料天然环保；2、工艺精巧细腻；3、产品实用美观；4、具有浓厚的地域特色。竹编工艺在中国南方地区尤为发达。"
    },
    {
        "question": "传统农耕技术有哪些？",
        "answer": "传统农耕技术包括轮作制度、有机肥料使用、水土保持措施等。这些技术注重与自然和谐共处，强调可持续发展，是现代生态农业的重要基础。传统农耕智慧体现了古人对自然规律的深刻理解。"
    },
    {
        "question": "什么是乡村美食？",
        "answer": "乡村美食是指源于农村地区的传统食物和烹饪方法，注重食材的本味和季节性。常见乡村美食包括农家腊肉、手工豆腐、时令野菜等，这些美食体现了'就地取材、因时而食'的饮食智慧。"
    },
    {
        "question": "如何保护非遗文化？",
        "answer": "非遗文化保护需要多方共同努力：1、记录和数字化保存；2、传承人培养；3、社区参与；4、与现代生活结合创新。保护非遗文化不仅是保存技艺，更是传承文化记忆和民族精神。"
    },
    {
        "question": "剪纸艺术有什么特点？",
        "answer": "剪纸是中国传统民间艺术，特点包括：1、工具简单（剪刀、红纸）；2、题材广泛（吉祥图案、民间故事）；3、寓意深刻；4、地域特色鲜明。剪纸不仅是装饰，更是寄托美好愿望的载体。"
    },
    {
        "question": "什么是生态农业？",
        "answer": "生态农业是一种注重生态系统平衡的农业生产方式，它尽量减少化学物质使用，保护生物多样性，实现农业可持续发展。生态农业结合了传统农耕智慧和现代科技，是未来农业的重要方向。"
    },
    {
        "question": "乡村建筑有哪些特色？",
        "answer": "乡村建筑特色包括：1、因地制宜的建筑材料；2、与自然环境和谐的设计；3、功能性强的空间布局；4、体现地方文化的装饰元素。传统乡村建筑是适应特定地理气候条件的智慧结晶。"
    },
    {
        "question": "传统节日在乡村文化中有什么意义？",
        "answer": "传统节日是乡村文化的重要载体，具有多重意义：1、强化社区凝聚力；2、传承文化记忆；3、调节农业生产节奏；4、表达对自然的敬畏。节日活动往往与农事周期密切相关。"
    },
    {
        "question": "如何学习传统手工艺？",
        "answer": "学习传统手工艺的途径包括：1、寻找传承人指导；2、参加非遗培训班；3、参观工艺博物馆；4、实践操作体验。学习过程中要注重理解技艺背后的文化内涵，而不仅仅是技术模仿。"
    },
    {
        "question": "浙江人教版小学三年级数学的除法易错点有哪些？",
        "answer": "小学三年级数学除法的易错点包括：1、余数概念理解不清，如忘记写余数或余数大于除数；2、除法竖式计算时数位对齐错误；3、应用题中未能正确理解'平均分'的含义；4、被除数中间或末尾有0的除法计算容易出错。建议通过实物演示和练习强化理解。"
    },
    {
        "question": "初中语文古诗文默写常见篇目（浙江中考范围）有哪些？",
        "answer": "浙江中考常见的古诗文默写篇目包括《论语》十二章、陶渊明《饮酒》、李白《行路难》、杜甫《春望》、苏轼《水调歌头·明月几时有》、范仲淹《岳阳楼记》等。重点考查名句默写和理解性默写，需熟记原文和注释。"
    },
    {
        "question": "小学科学“植物生长与环境”知识点如何结合浙江本地作物理解？",
        "answer": "可结合浙江常见的茶树、水稻、竹子等作物学习植物生长：1、茶树喜酸性土壤，适合浙江丘陵地形；2、水稻生长需充足水分，与浙江气候相关；3、竹子的地下茎繁殖体现植物适应性。通过观察本地作物，理解阳光、水分、土壤对生长的影响。"
    },

        // 从知识库中查找答案
        function findAnswerInKnowledgeBase(userMessage) {
            const startTime = Date.now();

            // 将用户消息转换为小写以便比较
            const lowerUserMessage = userMessage.toLowerCase();

            // 在知识库中查找匹配的问题
            for (const item of knowledgeBase.questions) {
                // 检查用户问题是否包含知识库中的关键词

                // 简单的关键词匹配 - 可以进一步优化
                if (lowerUserMessage.includes(lowerQuestion.replace('什么是', '').replace('有哪些', '').trim()) ||
                    lowerQuestion.includes(lowerUserMessage) ||
                    calculateSimilarity(lowerUserMessage, lowerQuestion) > 0.6) {

                    // 计算响应时间
                    const endTime = Date.now();
                    responseTime.textContent = `${((endTime - startTime) / 1000).toFixed(1)}s`;

                    return {
                        success: true,
                        data: {
                            answer: item.answer,
                            confidence: 0.9
                        }
                    };
                }
            }

            const endTime = Date.now();

                    confidence: 0.3
                }
            };
        }

        // 计算两个字符串的相似度（简单实现）
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;

            if (longer.length === 0) return 1.0;

            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }

        // 计算编辑距离
        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();

            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            }
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

            const message = userInput.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage(message, true);
            userInput.value = '';

            // 禁用发送按钮
            sendButton.disabled = true;

            try {
                // 从知识库获取AI回复
                const response = await getAIResponse(message);

                // 创建消息元素
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';

                const avatarDiv = document.createElement('img');
                avatarDiv.src = 'images/bot-avatar.png';
                avatarDiv.className = 'message-avatar bot-avatar';
                avatarDiv.alt = 'AI助手头像';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                const textDiv = document.createElement('div');
                textDiv.className = 'typewriter';

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString();

                contentDiv.appendChild(textDiv);
                contentDiv.appendChild(timeDiv);

                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(contentDiv);

                chatMessages.appendChild(messageDiv);

                // 使用打字机效果显示回复
                await typewriterMessage(response, textDiv);

                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                // 显示错误信息
                addMessage('抱歉，暂时无法获取回答。错误: ' + error.message, false, true);
            } finally {
                // 重新启用发送按钮
                sendButton.disabled = false;
                // 显示空闲动画
                showIdleAnimation();
            }
        }

        // 清空对话
        clearBtn.addEventListener('click', () => {
            chatMessages.innerHTML = `
                <div class="message bot-message">
                    <div class="message-avatar bot-avatar">
                        <img src='images/bot-avatar.png' style='width: 40px; height: 40px; border-radius: 50%;'/>
                    </div>
                    <div class="message-content">
                        <div>对话已清空。请问有什么可以帮您的？</div>
                        <div class="message-time">${new Date().toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
        });

        // 导出记录（模拟）
        exportBtn.addEventListener('click', () => {
            alert('导出功能正在开发中，即将推出！');
        });

        // 使用帮助
        helpBtn.addEventListener('click', () => {
            addMessage('您好！我是乡融智学AI助手，基于本地知识库提供乡村文化知识问答。您可以询问关于传统手工艺、农耕技术、民间艺术、乡村美食、非遗文化保护等方面的问题。知识库已加载完成，随时为您服务！', false);
        });

        // 事件监听
        sendButton.addEventListener('click', handleSendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        // 初始化焦点
        userInput.focus();

        // 页面加载时初始化
        window.addEventListener('load', () => {
            createParticles();
            updateAPIStatus(true);
        });
    </script>
</body>

</html>
