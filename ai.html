<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乡融智学 - 科技版</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
        }

        :root {
            --primary-color: #0a8c8c;
            --primary-dark: #066;
            --primary-light: #0db9b9;
            --accent-color: #00f5ff;
            --accent-glow: rgba(0, 245, 255, 0.5);
            --text-dark: #e0e0e0;
            --text-light: #a0a0a0;
            --bg-dark: #0a0f1a;
            --bg-darker: #050913;
            --bg-card: rgba(15, 25, 40, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error-color: #ff3e6d;
            --success-color: #00e6a9;
            --warning-color: #ffaa00;
        }

        body {
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            background-image:
                linear-gradient(rgba(10, 20, 40, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 20, 40, 0.8) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 5px 2px var(--accent-glow);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 700px;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 50px rgba(0, 245, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .chat-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color), var(--primary-color));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            z-index: -1;
        }

        .chat-header {
            background: rgba(10, 20, 40, 0.8);
            color: var(--text-dark);
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: messageAppear 0.3s ease-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border-bottom-right-radius: 5px;
            flex-direction: row-reverse;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--glass-bg);
            color: var(--text-dark);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 5px;
        }

        .error-message {
            align-self: flex-start;
            background: var(--error-color);
            color: white;
            border-bottom-left-radius: 5px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .user-avatar {
            background: linear-gradient(135deg, #4a7c59, #3a6b49);
        }

        .bot-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        }

        .message-content {
            flex: 1;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        .chat-input-container {
            display: flex;
            padding: 20px;
            background: rgba(10, 20, 40, 0.5);
            border-top: 1px solid var(--glass-border);
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(10, 140, 140, 0.3);
        }

        .input-field::placeholder {
            color: var(--text-light);
        }

        .send-button {
            padding: 15px 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .send-button:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button i {
            font-size: 18px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--glass-bg);
            color: var(--text-light);
            padding: 12px 18px;
            border-radius: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: typingPulse 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingPulse {

            0%,
            60%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            30% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .api-status {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .api-status.connected {
            background: rgba(0, 230, 169, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(0, 230, 169, 0.3);
        }

        .api-status.disconnected {
            background: rgba(255, 62, 109, 0.2);
            color: var(--error-color);
            border: 1px solid rgba(255, 62, 109, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .connected .status-dot {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .disconnected .status-dot {
            background: var(--error-color);
            box-shadow: 0 0 8px var(--error-color);
        }

        .typewriter {
            overflow: hidden;
            border-right: 2px solid var(--accent-color);
            white-space: pre-wrap;
            margin: 0;
            animation: blink-caret 1s step-end infinite;
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: var(--accent-color);
            }
        }

        .animation-container {
            position: fixed;
            bottom: 20px;
            right: 0px;
            z-index: 1000;
            width: 350px;
            height: 150px;
        }

        .status-animation {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2s infinite;
            position: absolute;
            top: 0;
            left: 0;
        }

        #thinking-animation {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        }

        #idle-animation {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
        }

        .animation-icon {
            font-size: 30px;
            color: white;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(10, 20, 40, 0.5);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 0 20px 15px;
        }

        .action-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-dark);
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .message {
                max-width: 85%;
            }

            .chat-input-container {
                padding: 15px;
            }

            .api-status {
                top: 10px;
                right: 10px;
            }

            .animation-container {
                width: 60px;
                height: 60px;
                bottom: 15px;
                right: 15px;
            }

            .animation-icon {
                font-size: 24px;
            }

            .message-avatar {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="api-status connected" id="apiStatus">
        <div class="status-dot"></div>
        <span>知识库已加载</span>
    </div>

    <div class="chat-container" style="position: relative;left: -200px;">
        <div class="chat-header">
            <div>AI+研学 - 本地知识库问答系统</div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span>会话ID:</span>
                <span id="sessionId">RST-20251201-001</span>
            </div>
            <div class="info-item">
                <span>响应时间:</span>
                <span id="responseTime">0.0s</span>
            </div>
            <div class="info-item">
                <span>知识库版本:</span>
                <span id="knowledgeVersion">v2.5.1</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="clearBtn">清空对话</button>
            <button class="action-btn" id="exportBtn">导出记录</button>
            <button class="action-btn" id="helpBtn">使用帮助</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar bot-avatar">
                    <img src='images/bot-avatar.png' style='width: 40px; height: 40px; border-radius: 50%;' />
                </div>
                <div class="message-content">
                    <div>您好！我是小智，现在基于本地知识库为您提供准确的乡村文化知识问答。我可以回答关于贵州榕江县的一些知识和文化方面的问题。</div>
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" class="input-field" id="userInput" placeholder="请输入关于乡村文化、传统手工艺、农耕技术等方面的问题..."
                autocomplete="off">
            <button class="send-button" id="sendButton">
                <i>➤</i> 发送
            </button>
        </div>
    </div>

    <!-- 右下角动图容器 -->
    <div class="animation-container">
        <!-- 回答问题时的动图1 -->
        <div class="status-animation" id="thinking-animation">
            <div class="animation-icon">
                <img src="images/gif/a.gif" alt="思考中">
            </div>
        </div>

        <!-- 空闲/回答完毕时的动图2 -->
        <div class="status-animation" id="idle-animation">
            <div class="animation-icon">
                <img src="images/gif/b.gif" alt="待机中">
            </div>
        </div>
    </div>


    <script type="application/json" id="myData">
{
  "questions":[
      {
          "question": "什么是榕江的传统手工艺？",
          "answer": "榕江乡村医疗条件：1、机构：每个乡镇有卫生院，行政村有卫生室，自然村有村医或卫生员。2、设备：乡镇卫生院有基本检查设备（B超、X光、化验），卫生室有常用药品和简单器械。3、人员：乡镇卫生院有执业医师和护士，村医多经培训，能处理常见病和多发病。4、医保：新型农村合作医疗参保率高，大病保险和医疗救助减轻了医疗负担。5、挑战：偏远村寨就医不便，村医年龄偏大、后继乏人，急救能力不足。6、传统医药：民族医药在乡村医疗中仍发挥作用，部分卫生院设有民族医科。医疗条件的改善显著提高了农民健康水平。"
      },
      {
          "question": "榕江的乡村饮水安全如何保障？",
          "answer": "榕江乡村饮水安全保障措施：1、水源保护：划定饮用水源保护区，禁止污染活动，植树造林涵养水源。2、集中供水：建设蓄水池、过滤池、消毒设施，通过管道输送到户，实现'自来水到家'。3、分散供水：对居住分散的农户，建设家庭水窖、蓄水池，收集雨水或山泉水，经简易过滤后使用。4、水质监测：定期对集中供水点进行水质检测，确保达标。5、管理维护：成立用水户协会，制定水费标准，专人维护管道。6、应急备用水源：干旱季节启动备用水源或送水车应急。饮水安全工程是重要的民生工程，极大改善了农村生活条件。"
      },
      {
          "question": "榕江的乡村厕所改造情况如何？",
          "answer": "榕江乡村'厕所革命'进展：1、传统厕所：多为旱厕，在房屋外独立建造，粪便用于施肥，但卫生条件差，蚊蝇滋生。2、改造方式：推广三格式化粪池厕所，粪便经无害化处理后可安全施肥；条件较好的接入污水管网。3、政策支持：政府提供改造补贴和技术指导。4、成效：卫生厕所普及率提高，减少了肠道传染病，改善了居住环境。5、挑战：山区改厕成本高，部分村民习惯难改，污水处理设施不配套。6、公共厕所：旅游村寨、集市等公共场所建设卫生公厕。厕所改造是农村人居环境整治的重要内容。"
      },
      {
          "question": "榕江的乡村道路建设有何变化？",
          "answer": "榕江乡村道路建设变化：1、从无到有：2000年前后实现'乡乡通油路'，2010年前后实现'村村通公路'（砂石路或水泥路）。2、提质升级：实施'组组通'硬化路，大部分自然寨通了水泥路；窄路面拓宽，危险路段安装护栏。3、管护机制：建立'路长制'，专人负责路段保洁和简易维护。4、影响：农产品运输成本降低，村民出行便利，摩托车、农用车普及，学生上学更安全。5、挑战：山区道路建设养护成本高，部分通组路宽度不足，会车困难。道路是乡村振兴的'血脉'，其改善深刻改变了乡村面貌。"
      },
      {
          "question": "榕江的乡村消防有何措施？",
          "answer": "榕江乡村消防措施：1、建筑防火：传统木房密集村寨开辟防火线，改建砖混结构建筑作为隔断；推广电改、灶改，规范用电用火。2、设施建设：修建高位消防水池，配备消防水泵、水带、水枪，较大村寨有消防摩托车或微型消防站。3、队伍建设：组建志愿消防队，定期培训演练。4、管理制度：实行鸣锣喊寨，提醒防火；重大节日加强巡逻。5、宣传教育：通过广播、宣传栏、微信群宣传消防知识。6、挑战：木质建筑多，巷道狭窄，消防车难进入；留守老人儿童防火意识弱。乡村消防是生命安全的重要保障。"
      },
      {
          "question": "榕江的乡村社会治安如何？",
          "answer": "榕江乡村社会治安状况：1、总体良好：民风淳朴，邻里纠纷多由寨老调解，恶性案件少。2、防控体系：'天网工程'覆盖主要路口和公共场所；驻村辅警、网格员负责治安信息收集和矛盾排查。3、突出问题：外出务工导致的家庭纠纷、财产纠纷增多；电信网络诈骗向农村蔓延；少数青少年因缺乏管教有不良行为。4、治理创新：'寨管委'、'院坝会'等村民自治形式化解矛盾；'合约食堂'规范酒席，减少因攀比引发的纠纷。5、交通安全：随着车辆增多，交通安全管理加强。良好的社会治安是乡村和谐稳定的基础。"
      },

        // 从知识库中查找答案
        function findAnswerInKnowledgeBase(userMessage) {
            const startTime = Date.now();

            // 将用户消息转换为小写以便比较
            const lowerUserMessage = userMessage.toLowerCase();

            // 在知识库中查找匹配的问题
            for (const item of knowledgeBase.questions) {
                // 检查用户问题是否包含知识库中的关键词
                const lowerQuestion = item.question.toLowerCase();

                // 简单的关键词匹配 - 可以进一步优化
                if (lowerUserMessage.includes(lowerQuestion.replace('什么是', '').replace('有哪些', '').trim()) ||
                    lowerQuestion.includes(lowerUserMessage) ||
                    calculateSimilarity(lowerUserMessage, lowerQuestion) > 0.6) {

                    // 计算响应时间
                    const endTime = Date.now();
                    responseTime.textContent = `${((endTime - startTime) / 1000).toFixed(1)}s`;

                    return {
                        success: true,
                        data: {
                            answer: item.answer,
                            confidence: 0.9
                        }
                    };
                }
            }

            // 如果没有找到匹配的问题，使用默认回复
            const endTime = Date.now();
            responseTime.textContent = `${((endTime - startTime) / 1000).toFixed(1)}s`;

            return {

                data: {
                    answer: getDefaultResponse(userMessage),
                    confidence: 0.3
                }
            };
        }

        // 计算两个字符串的相似度（简单实现）
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;

            if (longer.length === 0) return 1.0;

            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }

        // 计算编辑距离
        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();

            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            }
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function updateAPIStatus(isConnected) {
            if (isConnected) {
                apiStatus.textContent = '知识库已加载';
                apiStatus.className = 'api-status connected';
            } else {
                apiStatus.textContent = '知识库加载失败';
                apiStatus.className = 'api-status disconnected';
            }
        }

        // 处理用户发送消息
        async function handleSendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage(message, true);
            userInput.value = '';

            // 禁用发送按钮
            sendButton.disabled = true;

            try {
                // 从知识库获取AI回复
                const response = await getAIResponse(message);

                // 创建消息元素
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';

                const avatarDiv = document.createElement('img');
                avatarDiv.src = 'images/bot-avatar.png';
                avatarDiv.className = 'message-avatar bot-avatar';
                avatarDiv.alt = 'AI助手头像';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                const textDiv = document.createElement('div');
                textDiv.className = 'typewriter';

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString();

                contentDiv.appendChild(textDiv);
                contentDiv.appendChild(timeDiv);

                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(contentDiv);

                chatMessages.appendChild(messageDiv);

                // 使用打字机效果显示回复
                await typewriterMessage(response, textDiv);

                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                // 显示错误信息
                addMessage('抱歉，暂时无法获取回答。错误: ' + error.message, false, true);
            } finally {
                // 重新启用发送按钮
                sendButton.disabled = false;
                // 显示空闲动画
                showIdleAnimation();
            }
        }

        // 清空对话
        clearBtn.addEventListener('click', () => {
            chatMessages.innerHTML = `
                <div class="message bot-message">
                    <div class="message-avatar bot-avatar">
                        <img src='images/bot-avatar.png' style='width: 40px; height: 40px; border-radius: 50%;'/>
                    </div>
                    <div class="message-content">
                        <div>对话已清空。请问有什么可以帮您的？</div>
                        <div class="message-time">${new Date().toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
        });

        // 导出记录（模拟）
        exportBtn.addEventListener('click', () => {
            alert('导出功能正在开发中，即将推出！');
        });

        // 使用帮助
        helpBtn.addEventListener('click', () => {
            addMessage('您好！我是乡融智学AI助手，基于本地知识库提供乡村文化知识问答。您可以询问关于传统手工艺、农耕技术、民间艺术、乡村美食、非遗文化保护等方面的问题。知识库已加载完成，随时为您服务！', false);
        });

        // 事件监听
        sendButton.addEventListener('click', handleSendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        // 初始化焦点
        userInput.focus();

        // 页面加载时初始化
        window.addEventListener('load', () => {
            createParticles();
            updateAPIStatus(true);
        });
    </script>
</body>

</html>
